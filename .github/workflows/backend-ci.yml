name: SmartServe Backend CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    concurrency:
      group: backend-ci-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Verify with Maven
        run: ./mvnw --batch-mode verify

  deploy:
    name: Deploy to production
    needs: test
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    permissions:
      contents: read
      id-token: write

    concurrency:
      group: smartserve-production
      cancel-in-progress: false

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Package application
        run: ./mvnw --batch-mode -DskipTests package

      - name: Authenticate with AWS using GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: smartserve-${{ github.run_id }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            --tag "$REGISTRY/$REPOSITORY:$IMAGE_TAG" \
            .

          docker push "$REGISTRY/$REPOSITORY:$IMAGE_TAG"

      - name: Deploy image to EC2 through SSM
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -Eeuo pipefail

          PARAMETERS="$(
            jq -nc \
              --arg command "/opt/smartserve/deploy-backend.sh ${IMAGE_TAG}" \
              '{commands: [$command]}'
          )"

          COMMAND_ID="$(
            aws ssm send-command \
              --instance-ids "$INSTANCE_ID" \
              --document-name "AWS-RunShellScript" \
              --comment "Deploy SmartServe backend ${IMAGE_TAG}" \
              --parameters "$PARAMETERS" \
              --query "Command.CommandId" \
              --output text
          )"

          echo "SSM command ID: $COMMAND_ID"

          STATUS=""

          for attempt in {1..60}; do
            STATUS="$(
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --query "Status" \
                --output text \
                2>/dev/null || true
            )"

            echo "SSM status ${attempt}/60: ${STATUS:-not available yet}"

            case "$STATUS" in
              Success|Cancelled|Cancelling|Failed|TimedOut)
                break
                ;;
            esac

            sleep 5
          done

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}' \
            --output json

          if [[ "$STATUS" != "Success" ]]; then
            echo "Deployment failed with SSM status: ${STATUS:-unknown}" >&2
            exit 1
          fi
