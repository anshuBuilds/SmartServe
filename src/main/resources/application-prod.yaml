spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework
  error:
    include-message: never
    include-stacktrace: never

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}

  business-zone: ${BUSINESS_TIME_ZONE:Asia/Kolkata}

  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

  bootstrap:
    admin:
      username: ${SMARTSERVE_ADMIN_USERNAME}
      password: ${SMARTSERVE_ADMIN_PASSWORD}
      full-name: ${SMARTSERVE_ADMIN_FULL_NAME:System Admin}

razorpay:
  key-id: ${RAZORPAY_KEY_ID}
  key-secret: ${RAZORPAY_KEY_SECRET}
  currency: ${RAZORPAY_CURRENCY:INR}
  webhook-secret: ${RAZORPAY_WEBHOOK_SECRET}

management:
  endpoint:
    health:
      probes:
        enabled: true

      group:
        readiness:
          include: readinessState,db

        liveness:
          include: livenessState
